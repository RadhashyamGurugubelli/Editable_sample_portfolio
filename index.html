<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G.Radha Shyam - Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    :root {
      --bg: #0d0d0d;
      --text: #e8e8e8;
      --accent: #6c63ff;
      --accent-hover: #574bde;
      --card-bg: #151515;
      --border: #1f1f1f;
      --muted: #888;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Editable Wrapper Styles */
    .editable {
      position: relative;
      cursor: pointer;
      border-radius: 4px;
      outline: 1.5px dashed transparent;
      outline-offset: 3px;
      transition: outline 0.15s;
    }
    .editable.block { display: block; }
    .editable:hover {
      outline: 1.5px dashed var(--accent);
    }
    .editable:hover::after {
      content: "✏ Edit";
      position: absolute;
      top: -22px;
      right: 0;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }

    /* Image Upload Styles */
    .img-upload { cursor: pointer; position: relative; }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 60px;
    }
    .nav-name { font-weight: 700; font-size: 16px; color: #fff; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: 32px; }
    .nav-link {
      font-size: 13px; color: #666; cursor: pointer; text-decoration: none;
      background: none; border: none; padding: 0; transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: var(--accent); font-weight: 600; }

    /* --- UPDATED HERO SECTION --- */
    .hero { 
      max-width: 1000px; 
      margin: 0 auto; 
      padding: 120px 40px 100px; 
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
    }
    
    .hero-content {
      flex: 1;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 100px;
      padding: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 28px;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    
    h1 { font-size: clamp(40px, 5vw, 64px); font-weight: 800; line-height: 1.1; letter-spacing: -0.04em; color: #fff; margin: 0 0 20px; }
    h1 .accent { color: var(--accent); }
    .tagline { font-size: 18px; color: var(--muted); max-width: 560px; margin-bottom: 40px; }
    
    /* --- NEW DYNAMIC AVATAR STYLES --- */
    .hero-visual {
      position: relative;
      flex-shrink: 0;
    }
    
    /* Glowing background effect */
    .avatar-backdrop {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent), #e94560, #6c63ff);
      background-size: 200% 200%;
      z-index: 1;
      opacity: 0.4;
      filter: blur(25px);
      animation: glowPulse 6s ease-in-out infinite alternate, gradientMove 5s ease infinite;
    }

    .avatar-wrap {
      width: 240px; 
      height: 240px; 
      border-radius: 50%; 
      overflow: hidden;
      border: 4px solid var(--border); 
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center; position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 2;
      animation: float 6s ease-in-out infinite;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .avatar-wrap:hover {
      transform: translateY(-10px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 40px rgba(108,99,255,0.4);
    }

    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-overlay {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(108,99,255,0.4); display: flex;
      align-items: center; justify-content: center; opacity: 0;
      transition: opacity 0.2s; backdrop-filter: blur(2px);
    }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }

    /* Animations */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes glowPulse {
      0% { transform: scale(0.95); opacity: 0.3; }
      100% { transform: scale(1.05); opacity: 0.6; }
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Mobile adjustments for the Hero section */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column-reverse;
        text-align: center;
        padding: 80px 30px;
        gap: 40px;
      }
      .badge { margin: 0 auto 28px; }
      .cta-row { justify-content: center; }
      .avatar-wrap { width: 200px; height: 200px; }
      .tagline { margin: 0 auto 40px; }
    }

    /* Buttons */
    .cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: inline-block;
    }
    .btn-primary { background: var(--accent); border: none; color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid #333; color: #aaa; }
    .btn-outline:hover { border-color: #666; color: #fff; }
    
    /* Sections & Grids (Remaining Styles) */
    .section { max-width: 900px; margin: 0 auto; padding: 80px 40px; }
    .section-label { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 8px; }
    .section-title { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -0.03em; margin: 0 0 48px; }
    .divider { height: 1px; background: #1a1a1a; max-width: 900px; margin: 0 auto; }

    .work-card { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; transition: transform 0.2s; }
    .work-card:hover { transform: translateY(-4px); border-color: #333; }
    .work-img-area { height: 200px; background: #0d0d0d; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
    .work-img-area img { width: 100%; height: 100%; object-fit: cover; }
    .work-inner { padding: 32px; }
    .work-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cat { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
    .work-title { font-size: 26px; font-weight: 800; color: #fff; margin: 0 0 12px; letter-spacing: -0.02em; }
    .work-desc { font-size: 15px; color: #999; margin: 0 0 20px; line-height: 1.7; }
    .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { padding: 4px 12px; background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.2); border-radius: 100px; font-size: 12px; color: #8b87ff; }

    .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .proj-card { background: #111; border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s; }
    .proj-card:hover { transform: translateY(-4px); border-color: #333; }
    .proj-img { height: 120px; background: #0d0d0d; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .proj-img img { width: 100%; height: 100%; object-fit: cover; }
    .proj-title { font-size: 17px; font-weight: 700; color: #fff; }
    .proj-desc { font-size: 14px; color: var(--muted); line-height: 1.6; flex: 1; margin: 0; }
    .proj-link { font-size: 13px; color: var(--accent); text-decoration: none; }

    .skills-wrap { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .skill-tag { padding: 8px 18px; background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 100px; font-size: 13px; color: #bbb; }
    .bio-text { font-size: 16px; color: #999; line-height: 1.8; max-width: 640px; margin: 0;}
    .contact-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 24px; }
    .socials { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    
    .action-btn { background: transparent; border-radius: 5px; cursor: pointer; font-size: 11px; padding: 4px 10px; }
    .btn-del { border: 1px solid #3a1a1a; color: #e94560; transition: background 0.2s; }
    .btn-del:hover { background: rgba(233, 69, 96, 0.1); }
    .btn-add { margin-top: 16px; padding: 10px 20px; background: transparent; border: 1px dashed #333; border-radius: 8px; color: #555; cursor: pointer; font-size: 13px; width: 100%; transition: all 0.2s;}
    .btn-add:hover { border-color: #666; color: #fff; }

    footer { text-align: center; padding: 60px 40px; border-top: 1px solid #1a1a1a; color: #444; font-size: 13px; }

    /* Modal */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
      backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-overlay.active { display: flex; }
    .modal-content {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 28px; min-width: 360px; max-width: 540px; width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-label { color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
    .modal-input {
      width: 100%; background: #111; border: 1px solid #444; border-radius: 8px;
      color: #fff; padding: 12px; font-size: 15px; font-family: inherit; box-sizing: border-box;
    }
    .modal-input:focus { outline: none; border-color: var(--accent); }
    textarea.modal-input { min-height: 120px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  </style>
</head>
<body>

  <input type="file" id="file-uploader" accept="image/*" style="display: none;">

  <div id="modal-overlay">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-label" id="modal-field-name">Field</div>
      <div id="modal-input-container"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" style="padding: 8px 18px;" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="padding: 8px 18px;" onclick="saveModal()">Save</button>
      </div>
    </div>
  </div>

  <div id="app"></div>

  <script>
    // --- Initial State ---
    let data = {
      name: "G.Radha Shyam",
      title: "CSE-AI&DS Student ",
      tagline: "Machine learning and Data Science enthusiast",
      bio: "Student at NIT Warangel  Btech-2 nd year 2025-2029..Mchine learning and Data Science enthusiast",
      email: "radhashyamgurugubelli@gmail.com",
      location: "Andhra Pradesh, India",
      avatar: null,
      socials: {
        github: "https://github.com/RadhashyamGurugubelli",
        linkedin: "https://www.linkedin.com/public-profile/settings/",
        twitter: "None",
        dribbble: "None",
      },
      skills: ["UI/UX Design", "React", "Figma", "TypeScript", "Design Systems", "Prototyping"],
      works: [
        {
          id: 1, title: "Pulse Health", category: "Product Design", year: "2024",
          description: "Redesigned the patient onboarding flow, reducing drop-off by 38%. Led research, wireframing, and final UI delivery.",
          tags: ["Healthcare", "Mobile", "Figma"], color: "#1a1a2e", accent: "#e94560", image: null,
        },
        {
          id: 2, title: "Verdant Finance", category: "Design System", year: "2024",
          description: "Built a token-based design system from scratch, covering 200+ components across web and mobile platforms.",
          tags: ["Fintech", "Design System", "React"], color: "#0f3460", accent: "#16213e", image: null,
        },
        {
          id: 3, title: "Terrain Maps", category: "Web App", year: "2023",
          description: "Full-stack geospatial visualization tool built with Mapbox and Next.js for climate data researchers.",
          tags: ["Climate", "Web App", "Data Viz"], color: "#1b4332", accent: "#40916c", image: null,
        },
      ],
      projects: [
        {
          id: 1, title: "Open Design Tokens", description: "An open-source library of semantic design tokens compatible with Figma, Tailwind, and CSS custom properties.", link: "github.com/alexrivera/design-tokens", stars: "1.2k", image: null,
        },
        {
          id: 2, title: "Typeface Pairing Tool", description: "A browser-based tool for testing font pairings with real content. Used by 4k+ designers monthly.", link: "typetool.io", stars: "847", image: null,
        },
      ],
    };

    // --- State Management Helpers ---
    function getPath(obj, path) {
      return path.split('.').reduce((acc, part) => acc && acc[part], obj);
    }

    function setPath(obj, path, value) {
      const keys = path.split('.');
      let current = obj;
      for (let i = 0; i < keys.length - 1; i++) {
        current = current[keys[i]];
      }
      current[keys[keys.length - 1]] = value;
      renderApp();
    }

    // --- Modal Logic ---
    let currentEditPath = null;

    function openModal(path, type) {
      currentEditPath = path;
      const value = getPath(data, path);
      
      document.getElementById('modal-field-name').innerText = path.replace(/\./g, ' › ');
      const container = document.getElementById('modal-input-container');
      
      if (type === 'textarea') {
        container.innerHTML = `<textarea class="modal-input" id="modal-input-field">${value || ''}</textarea>`;
      } else {
        container.innerHTML = `<input type="text" class="modal-input" id="modal-input-field" value="${value || ''}">`;
        document.getElementById('modal-input-field').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') saveModal();
        });
      }
      
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('modal-input-field').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      currentEditPath = null;
    }

    function saveModal() {
      if (!currentEditPath) return;
      const value = document.getElementById('modal-input-field').value;
      setPath(data, currentEditPath, value);
      closeModal();
    }

    document.getElementById('modal-overlay').addEventListener('click', closeModal);

    // --- Image Upload Logic ---
    let currentImagePath = null;
    const fileUploader = document.getElementById('file-uploader');

    fileUploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentImagePath) return;
      
      const reader = new FileReader();
      reader.onload = (ev) => {
        setPath(data, currentImagePath, ev.target.result);
        currentImagePath = null;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; 
    });

    // --- Event Delegation ---
    document.addEventListener('click', (e) => {
      const editable = e.target.closest('.editable');
      if (editable && !e.target.closest('.action-btn')) {
        e.preventDefault();
        openModal(editable.dataset.path, editable.dataset.type || 'text');
      }

      const imgUpload = e.target.closest('.img-upload');
      if (imgUpload && !e.target.closest('.editable') && !e.target.closest('.action-btn')) {
        currentImagePath = imgUpload.dataset.path;
        fileUploader.click();
      }

      const action = e.target.closest('[data-action]');
      if (action) {
        const type = action.dataset.action;
        const id = parseInt(action.dataset.id);
        
        if (type === 'add-work') {
          data.works.push({
            id: Date.now(), title: "New Project", category: "Category", year: "2024",
            description: "Describe this project.", tags: ["Tag"], color: "#1a1a2e", accent: "#6c63ff", image: null
          });
          renderApp();
        } else if (type === 'del-work') {
          data.works = data.works.filter(w => w.id !== id);
          renderApp();
        } else if (type === 'add-tag') {
          const workIndex = data.works.findIndex(w => w.id === id);
          data.works[workIndex].tags.push("New Tag");
          renderApp();
        } else if (type === 'add-project') {
          data.projects.push({
            id: Date.now(), title: "New Project", description: "Description here.", link: "example.com", stars: "0", image: null
          });
          renderApp();
        } else if (type === 'del-project') {
          data.projects = data.projects.filter(p => p.id !== id);
          renderApp();
        } else if (type === 'add-skill') {
          data.skills.push("New Skill");
          renderApp();
        } else if (type === 'nav') {
          document.getElementById(action.dataset.target)?.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    // --- Rendering Engine ---
    function renderApp() {
      const app = document.getElementById('app');

      app.innerHTML = `
        <nav class="nav">
          <span class="editable nav-name" data-path="name">${data.name}</span>
          <div class="nav-links">
            <button class="nav-link" data-action="nav" data-target="works">Works</button>
            <button class="nav-link" data-action="nav" data-target="projects">Projects</button>
            <button class="nav-link" data-action="nav" data-target="about">About</button>
          </div>
        </nav>

        <section class="hero">
          <div class="hero-content">
            <div class="badge">
              <div class="dot"></div>
              <span class="editable" data-path="title">${data.title}</span>
            </div>

            <h1>
              <span class="editable" data-path="name">${data.name}</span><br>
              <span class="accent editable block" data-path="tagline" data-type="textarea">${data.tagline}</span>
            </h1>

            <p class="tagline">
              <span class="editable block" data-path="bio" data-type="textarea">${data.bio}</span>
            </p>

            <div class="cta-row">
              <button class="btn btn-primary" data-action="nav" data-target="works">View My Work</button>
              <button class="btn btn-outline" data-action="nav" data-target="about">Get in Touch</button>
            </div>
          </div>

          <div class="hero-visual">
            <div class="avatar-backdrop"></div>
            <div class="img-upload avatar-wrap" data-path="avatar" title="Click to upload photo">
              ${data.avatar ? `<img src="${data.avatar}" alt="Avatar">` : `<span style="font-size:80px">👤</span>`}
              <div class="avatar-overlay"><span style="color:#fff; font-size:32px;">📷</span></div>
            </div>
          </div>
        </section>

        <div class="divider"></div>

        <section id="works" class="section">
          <p class="section-label">Selected Work</p>
          <h2 class="section-title">Projects I'm proud of</h2>

          ${data.works.map((work, index) => `
            <div class="work-card" style="background: ${work.color || '#151515'};">
              <div class="img-upload work-img-area" data-path="works.${index}.image" title="Click to upload image">
                ${work.image ? `<img src="${work.image}">` : `<span style="color:#666; font-size:13px;">📷 Click to add cover image</span>`}
              </div>
              <div class="work-inner">
                <div class="work-meta">
                  <span class="cat editable" data-path="works.${index}.category">${work.category}</span>
                  <span style="font-size:13px; color:#555;" class="editable" data-path="works.${index}.year">${work.year}</span>
                </div>
                <h3 class="work-title editable block" data-path="works.${index}.title">${work.title}</h3>
                <p class="work-desc editable block" data-path="works.${index}.description" data-type="textarea">${work.description}</p>
                
                <div class="tag-row">
                  ${work.tags.map((t, tIndex) => `
                    <span class="tag editable" data-path="works.${index}.tags.${tIndex}">${t}</span>
                  `).join('')}
                  <button class="tag action-btn" style="background:transparent; border:1px dashed #333; color:#888;" data-action="add-tag" data-id="${work.id}">+ tag</button>
                </div>
                
                <div style="margin-top:16px;">
                  <button class="action-btn btn-del" data-action="del-work" data-id="${work.id}">Remove</button>
                </div>
              </div>
            </div>
          `).join('')}
          <button class="btn-add" data-action="add-work">+ Add Work</button>
        </section>

        <div class="divider"></div>

        <section id="projects" class="section">
          <p class="section-label">Side Projects & Open Source</p>
          <h2 class="section-title">Things I build for fun</h2>

          <div class="proj-grid">
            ${data.projects.map((proj, index) => `
              <div class="proj-card">
                <div class="img-upload proj-img" data-path="projects.${index}.image">
                  ${proj.image ? `<img src="${proj.image}">` : `<span style="color:#444; font-size:12px;">📷 Add image</span>`}
                </div>
                <div class="proj-title editable block" data-path="projects.${index}.title">${proj.title}</div>
                <p class="proj-desc editable block" data-path="projects.${index}.description" data-type="textarea">${proj.description}</p>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span class="proj-link editable" data-path="projects.${index}.link">↗ ${proj.link}</span>
                  <span style="font-size:12px; color:#555;" class="editable" data-path="projects.${index}.stars">★ ${proj.stars}</span>
                </div>
                <div>
                  <button class="action-btn btn-del" data-action="del-project" data-id="${proj.id}">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
          <button class="btn-add" data-action="add-project">+ Add Project</button>
        </section>

        <div class="divider"></div>

        <section id="about" class="section">
          <p class="section-label">About Me</p>
          <h2 class="section-title">A bit more about who I am</h2>

          <p class="bio-text editable block" data-path="bio" data-type="textarea">${data.bio}</p>

          <div class="skills-wrap">
            ${data.skills.map((sk, index) => `
              <span class="skill-tag editable" data-path="skills.${index}">${sk}</span>
            `).join('')}
            <button class="skill-tag" style="background:transparent; border:1px dashed #333; cursor:pointer;" data-action="add-skill">+ Add Skill</button>
          </div>

          <div class="contact-row">
            <span style="font-size:14px; color:#666;" class="editable" data-path="email">✉ ${data.email}</span>
            <span style="font-size:14px; color:#666;" class="editable" data-path="location">📍 ${data.location}</span>
          </div>

          <div class="socials">
            ${Object.entries(data.socials).map(([key, val]) => `
              <span style="font-size:13px; color:#555;" class="editable" data-path="socials.${key}">
                ${key.charAt(0).toUpperCase() + key.slice(1)}: ${val}
              </span>
            `).join('')}
          </div>
        </section>

        <footer>
          <p>
            Designed & built by <span class="editable" style="color:var(--accent);" data-path="name">${data.name}</span>
          </p>
          <p style="margin-top:8px; font-size:11px; color:#333;">
            Hover any text to edit · Click images to replace
          </p>
        </footer>
      `;
    }

    renderApp();
  </script>
</body>
</html>
